
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">

<head>
    <title th:text="${loggedInUser.name} + ' | SCM'">Profile Page</title>
</head>

<body>

<div id="content">

    <!-- Sidebar -->
    <div th:if="${loggedInUser}">
        <div th:replace="~{user/sidebar :: sidebar}"></div>
    </div>

    <!-- Profile Section -->
    <div class="sm:pl-64 pt-20 min-h-screen px-4 pb-10">

        <div class="flex items-center justify-center md:pt-20 flex-col">

            <!-- Profile Card -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg max-w-2xl w-full">

                <div class="flex flex-col items-center">

                    <!-- Profile Picture -->
                    <form th:action="@{/user/profile/change-photo}"
                          method="post"
                          enctype="multipart/form-data"
                          id="profilePhotoForm"
                          class="w-full flex flex-col items-center gap-3 mb-6">

                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <input type="hidden" name="returnTo" value="/user/profile"/>

                    <div class="relative mb-4">

                        <img id="profilePreview"
                             th:src="${(loggedInUser.profilePic != null and !#strings.isEmpty(loggedInUser.profilePic)) ? loggedInUser.profilePic : '/images/telephone.png'}"
                             src="/images/telephone.png"
                             onerror="this.onerror=null; this.src='/images/telephone.png'"
                             alt="Profile Photo"
                             class="w-44 h-44 rounded-full shadow-lg object-cover border-4 border-blue-500">

                        <!-- Change Photo Button -->

                        <label for="profileImage"
                               class="absolute bottom-1 right-1 bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg cursor-pointer transition duration-200"
                               title="Change profile photo">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="w-5 h-5"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M15.232 5.232l3.536 3.536M4 20l4.5-1 11-11a2.5 2.5 0 00-3.536-3.536l-11 11L4 20z"/>
                            </svg>

                        </label>

                        <input type="file"
                               id="profileImage"
                               name="profileImage"
                               accept="image/jpeg,image/png,image/webp"
                               class="sr-only"/>

                    </div>

                    <h2 class="text-2xl font-semibold mb-2 text-gray-800 dark:text-white"
                        th:text="${loggedInUser.name}">
                        User Name
                    </h2>

                    <p class="text-gray-600 dark:text-gray-300 mb-2"
                       th:text="${loggedInUser.email}">
                        user.email@example.com
                    </p>

                    <p class="text-gray-600 dark:text-gray-300 mb-2"
                       th:text="${loggedInUser.phoneNumber}">
                        123-456-7890
                    </p>

                    <p class="text-gray-600 dark:text-gray-300 mb-4 text-center"
                       th:text="${loggedInUser.about}">
                        About the user...
                    </p>

                        <p id="selectedFileName"
                           class="text-sm text-gray-500 dark:text-gray-400 text-center">
                        </p>

                        <p class="text-xs text-gray-500 dark:text-gray-400">
                            JPG, PNG or WEBP · Maximum 5 MB
                        </p>

                        <div id="photoActions"
                             class="hidden flex-wrap justify-center gap-3">

                            <button type="submit"
                                    id="savePhotoButton"
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition duration-200">

                                Save Photo
                            </button>

                            <button type="button"
                                    id="cancelPhotoButton"
                                    class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-800 dark:text-white px-5 py-2 rounded-lg transition duration-200">

                                Cancel
                            </button>

                        </div>

                    </form>

                    <!-- Upload Success Message -->
                    <div th:if="${successMessage}"
                         th:text="${successMessage}"
                         class="w-full text-center text-green-700 bg-green-100 p-3 rounded-lg mb-4">
                    </div>

                    <!-- Upload Error Message -->
                    <div th:if="${errorMessage}"
                         th:text="${errorMessage}"
                         class="w-full text-center text-red-700 bg-red-100 p-3 rounded-lg mb-4">
                    </div>

                    <!-- Verification Status -->
                    <div class="w-full flex flex-col sm:flex-row justify-between gap-3 border-t border-gray-200 dark:border-gray-700 pt-4">

                        <p class="text-sm text-gray-500 dark:text-gray-400">
                            Email Verified:
                            <span class="font-medium text-gray-700 dark:text-gray-200"
                                  id="email-verified"
                                  th:text="${loggedInUser.emailVerified ? 'YES' : 'NO'}">
                                NO
                            </span>
                        </p>

                        <p class="text-sm text-gray-500 dark:text-gray-400">
                            Phone Verified:
                            <span class="font-medium text-gray-700 dark:text-gray-200"
                                  id="phone-verified"
                                  th:text="${loggedInUser.phoneVerified ? 'YES' : 'NO'}">
                                NO
                            </span>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>
    (function () {
        const imageInput = document.getElementById("profileImage");
        const preview = document.getElementById("profilePreview");
        const fileName = document.getElementById("selectedFileName");
        const actions = document.getElementById("photoActions");
        const cancelButton = document.getElementById("cancelPhotoButton");
        const form = document.getElementById("profilePhotoForm");
        const saveButton = document.getElementById("savePhotoButton");

        // Check that all required HTML elements exist.
        if (!imageInput || !preview || !fileName ||
            !actions || !cancelButton || !form || !saveButton) {
            console.error("Profile photo error: Required HTML element is missing.");
            return;
        }

        const originalImage = preview.src;
        let previewUrl = null;

        imageInput.addEventListener("change", function () {
            const file = imageInput.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                alert("Please select a valid image.");
                imageInput.value = "";
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert("Image size must not exceed 5 MB.");
                imageInput.value = "";
                return;
            }

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

            previewUrl = URL.createObjectURL(file);
            preview.src = previewUrl;
            fileName.textContent = "Uploading " + file.name + "...";
            actions.classList.remove("hidden");
            actions.classList.add("flex");
            saveButton.disabled = true;
            saveButton.textContent = "Uploading...";
            form.submit();
        });


        // Cancel the selection.
        cancelButton.addEventListener("click", function () {
            imageInput.value = "";
            preview.src = originalImage;
            fileName.textContent = "";

            actions.classList.add("hidden");
            actions.classList.remove("flex");

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
                previewUrl = null;
            }
        });

        // Prevent submitting without a selected file.
        form.addEventListener("submit", function (event) {
            if (!imageInput.files.length) {
                event.preventDefault();
                alert("Please select a profile photo first.");
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "Uploading...";
        });
    })();
</script>


</body>
</html>
